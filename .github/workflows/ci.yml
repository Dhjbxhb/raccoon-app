name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: backend
        # Scoped to tests marked @pytest.mark.unit: pure logic tests with no
        # live server/DB/network dependency. Most of tests/ predates this and
        # expects a running server + real Mongo/Firebase, which this CI job
        # doesn't stand up - see backend/pytest.ini.
        run: python -m pytest tests/ -m unit -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        # CI=false to match how the VPS actually builds (plain `yarn build`,
        # no CI flag) - GitHub Actions sets CI=true by default, which turns
        # pre-existing eslint warnings (unrelated to this workflow) into
        # build failures via react-scripts/craco.
        run: yarn build
        env:
          CI: false
